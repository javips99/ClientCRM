<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClientCRM — Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <!-- ── Página de login ─────────────────────────────────────── -->
  <div class="login-page">
    <div class="login-card">

      <!-- Logo -->
      <div class="login-logo">
        <span class="login-logo-icon">📊</span>
        <h1>ClientCRM</h1>
        <p>Gestor de clientes para tu equipo comercial</p>
      </div>

      <!-- Mensaje de error -->
      <div class="login-error" id="loginError" role="alert"></div>

      <!-- Formulario -->
      <form class="login-form" id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            placeholder="admin@clientcrm.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          >
        </div>

        <button type="submit" class="btn btn-primary" id="btnLogin">
          Entrar al CRM
        </button>
      </form>

      <p style="text-align:center; margin-top:1.5rem; font-size:0.8rem; color:var(--text-muted);">
        Demo: <strong style="color:var(--text)">admin@clientcrm.com</strong> /
        <strong style="color:var(--text)">admin123</strong>
      </p>

    </div>
  </div>

  <!-- Contenedor de toasts -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
