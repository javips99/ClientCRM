<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClientCRM — Clientes</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <!-- ── Navbar ─────────────────────────────────────────────── -->
  <nav class="navbar">
    <a href="dashboard.html" class="nav-brand">📊 ClientCRM</a>

    <ul class="nav-links">
      <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
      <li><a href="clientes.html"  class="nav-link active">Clientes</a></li>
    </ul>

    <div class="nav-user">
      <span class="nav-user-name" id="navUserName"></span>
      <button class="btn btn-ghost btn-sm" id="btnLogout">Salir</button>
    </div>
  </nav>

  <!-- ── Contenido ──────────────────────────────────────────── -->
  <main class="main-content">

    <!-- Cabecera -->
    <div class="page-header d-flex align-center justify-between" style="flex-wrap:wrap; gap:1rem;">
      <div>
        <h1 class="page-title">Clientes</h1>
        <p class="page-subtitle" id="totalLabel">Cargando…</p>
      </div>
      <button class="btn btn-primary" id="btnNuevoCliente">+ Nuevo cliente</button>
    </div>

    <!-- Barra de filtros -->
    <div class="filter-bar mb-2">
      <input
        type="search"
        id="searchInput"
        class="form-control search-input"
        placeholder="Buscar por nombre, empresa o email…"
        aria-label="Buscar clientes"
      >
      <select id="filtroEstado" class="form-control filter-select">
        <option value="">Todos los estados</option>
        <option value="caliente">🔴 Caliente</option>
        <option value="tibio">🟡 Tibio</option>
        <option value="frio">🔵 Frío</option>
        <option value="ganado">🟢 Ganado</option>
      </select>
    </div>

    <!-- Tabla -->
    <div class="table-wrapper">
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Nombre</th>
              <th class="col-empresa">Empresa</th>
              <th>Estado</th>
              <th class="col-telefono">Teléfono</th>
              <th class="text-right">Pipeline</th>
              <th class="text-right">Acciones</th>
            </tr>
          </thead>
          <tbody id="tbodyClientes">
            <tr class="loading-row">
              <td colspan="6"><span class="spinner"></span> Cargando clientes…</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>

  <!-- ── Modal crear / editar cliente ──────────────────────── -->
  <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Nuevo cliente</h2>
        <button class="modal-close" id="btnModalClose" aria-label="Cerrar">&times;</button>
      </div>

      <form id="formCliente" novalidate>
        <input type="hidden" id="clienteId">

        <!-- Fila 1: nombre + empresa -->
        <div class="form-row">
          <div class="form-group">
            <label for="fNombre">Nombre <span style="color:var(--coral)">*</span></label>
            <input type="text" id="fNombre" class="form-control" placeholder="Ej: María García" required maxlength="150">
          </div>
          <div class="form-group">
            <label for="fEmpresa">Empresa</label>
            <input type="text" id="fEmpresa" class="form-control" placeholder="Ej: Acme S.L." maxlength="150">
          </div>
        </div>

        <!-- Fila 2: email + teléfono -->
        <div class="form-row">
          <div class="form-group">
            <label for="fEmail">Email</label>
            <input type="email" id="fEmail" class="form-control" placeholder="correo@empresa.com">
          </div>
          <div class="form-group">
            <label for="fTelefono">Teléfono</label>
            <input type="tel" id="fTelefono" class="form-control" placeholder="600 000 000" maxlength="20">
          </div>
        </div>

        <!-- Fila 3: estado + valor -->
        <div class="form-row">
          <div class="form-group">
            <label for="fEstado">Estado <span style="color:var(--coral)">*</span></label>
            <select id="fEstado" class="form-control" required>
              <option value="frio">🔵 Frío</option>
              <option value="tibio">🟡 Tibio</option>
              <option value="caliente">🔴 Caliente</option>
              <option value="ganado">🟢 Ganado</option>
            </select>
          </div>
          <div class="form-group">
            <label for="fValor">Valor estimado (€)</label>
            <input type="number" id="fValor" class="form-control" placeholder="0.00" min="0" step="0.01">
          </div>
        </div>
      </form>

      <div class="modal-footer">
        <button class="btn btn-ghost" id="btnCancelar">Cancelar</button>
        <button class="btn btn-primary" id="btnGuardar">Guardar cliente</button>
      </div>
    </div>
  </div>

  <!-- Modal de confirmación de borrado -->
  <div class="modal-overlay" id="modalDeleteOverlay" role="alertdialog" aria-modal="true" aria-labelledby="modalDeleteTitle">
    <div class="modal" style="max-width:400px;">
      <div class="modal-header">
        <h2 class="modal-title" id="modalDeleteTitle">¿Eliminar cliente?</h2>
        <button class="modal-close" id="btnDeleteClose">&times;</button>
      </div>
      <p style="color:var(--text-muted); font-size:0.9rem; line-height:1.6;">
        Esta acción eliminará al cliente y todas sus notas de actividad.
        <strong style="color:var(--text)">No se puede deshacer.</strong>
      </p>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="btnDeleteCancelar">Cancelar</button>
        <button class="btn btn-danger" id="btnDeleteConfirmar">Sí, eliminar</button>
      </div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/demo.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/clientes.js"></script>
</body>
</html>
