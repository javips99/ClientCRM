<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClientCRM — Detalle de cliente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;0,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <!-- ── Navbar ─────────────────────────────────────────────── -->
  <nav class="navbar">
    <a href="dashboard.html" class="nav-brand">📊 ClientCRM</a>

    <ul class="nav-links">
      <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
      <li><a href="clientes.html"  class="nav-link active">Clientes</a></li>
    </ul>

    <div class="nav-user">
      <span class="nav-user-name" id="navUserName"></span>
      <button class="btn btn-ghost btn-sm" id="btnLogout">Salir</button>
    </div>
  </nav>

  <!-- ── Contenido ──────────────────────────────────────────── -->
  <main class="main-content">

    <!-- Miga de pan -->
    <p style="margin-bottom:1.25rem; font-size:0.85rem; color:var(--text-muted);">
      <a href="clientes.html">← Volver a clientes</a>
    </p>

    <!-- Grid principal: ficha + notas -->
    <div class="client-detail-grid" id="clienteDetalle">

      <!-- Columna izquierda: ficha del cliente -->
      <div class="client-card" id="clienteCard">
        <div style="display:flex; justify-content:center; margin-bottom:1rem;">
          <div class="client-avatar">👤</div>
        </div>
        <p class="client-name text-center" id="detNombre">—</p>
        <p class="client-company text-center" id="detEmpresa">—</p>
        <div style="text-align:center; margin-bottom:0.5rem;" id="detBadge"></div>

        <div class="client-meta" id="clienteMeta">
          <div class="client-meta-item">📧 <span id="detEmail">—</span></div>
          <div class="client-meta-item">📞 <span id="detTelefono">—</span></div>
          <div class="client-meta-item">💶 <span id="detValor">—</span></div>
          <div class="client-meta-item">📅 <span id="detFecha">—</span></div>
        </div>

        <div class="client-actions">
          <button class="btn btn-ghost" id="btnEditar" style="flex:1; justify-content:center;">✏️ Editar</button>
          <button class="btn btn-danger" id="btnEliminar" style="flex:1; justify-content:center;">🗑️ Eliminar</button>
        </div>
      </div>

      <!-- Columna derecha: notas -->
      <div class="notes-section">
        <h3>📋 Actividad y notas</h3>

        <!-- Formulario nueva nota -->
        <div class="add-note-form">
          <textarea
            id="nuevaNota"
            class="form-control"
            placeholder="Escribe una nota de actividad… (llamada, reunión, seguimiento)"
            rows="3"
          ></textarea>
          <button class="btn btn-primary" id="btnAgregarNota">Añadir nota</button>
        </div>

        <!-- Timeline de notas -->
        <div class="notes-timeline" id="notesTimeline">
          <p class="text-muted" style="font-size:0.875rem;">Cargando notas…</p>
        </div>
      </div>

    </div><!-- /.client-detail-grid -->
  </main>

  <!-- ── Modal editar cliente ────────────────────────────────── -->
  <div class="modal-overlay" id="modalEditarOverlay" role="dialog" aria-modal="true" aria-labelledby="modalEditarTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 class="modal-title" id="modalEditarTitle">Editar cliente</h2>
        <button class="modal-close" id="btnEditarClose">&times;</button>
      </div>

      <form id="formEditar" novalidate>
        <input type="hidden" id="editId">
        <div class="form-row">
          <div class="form-group">
            <label for="editNombre">Nombre *</label>
            <input type="text" id="editNombre" class="form-control" required maxlength="150">
          </div>
          <div class="form-group">
            <label for="editEmpresa">Empresa</label>
            <input type="text" id="editEmpresa" class="form-control" maxlength="150">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="editEmail">Email</label>
            <input type="email" id="editEmail" class="form-control">
          </div>
          <div class="form-group">
            <label for="editTelefono">Teléfono</label>
            <input type="tel" id="editTelefono" class="form-control" maxlength="20">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="editEstado">Estado *</label>
            <select id="editEstado" class="form-control" required>
              <option value="frio">🔵 Frío</option>
              <option value="tibio">🟡 Tibio</option>
              <option value="caliente">🔴 Caliente</option>
              <option value="ganado">🟢 Ganado</option>
            </select>
          </div>
          <div class="form-group">
            <label for="editValor">Valor estimado (€)</label>
            <input type="number" id="editValor" class="form-control" min="0" step="0.01">
          </div>
        </div>
      </form>

      <div class="modal-footer">
        <button class="btn btn-ghost" id="btnEditarCancelar">Cancelar</button>
        <button class="btn btn-primary" id="btnEditarGuardar">Guardar cambios</button>
      </div>
    </div>
  </div>

  <!-- Modal confirmación de borrado -->
  <div class="modal-overlay" id="modalDeleteOverlay" role="alertdialog" aria-modal="true">
    <div class="modal" style="max-width:400px;">
      <div class="modal-header">
        <h2 class="modal-title">¿Eliminar cliente?</h2>
        <button class="modal-close" id="btnDeleteClose">&times;</button>
      </div>
      <p style="color:var(--text-muted); font-size:0.9rem; line-height:1.6;">
        Se eliminarán todos sus datos y notas de actividad.
        <strong style="color:var(--text)">No se puede deshacer.</strong>
      </p>
      <div class="modal-footer">
        <button class="btn btn-ghost" id="btnDeleteCancelar">Cancelar</button>
        <button class="btn btn-danger" id="btnDeleteConfirmar">Sí, eliminar</button>
      </div>
    </div>
  </div>

  <!-- Toasts -->
  <div class="toast-container" id="toastContainer"></div>

  <script src="assets/js/utils.js"></script>
  <script src="assets/js/demo.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cliente-detalle.js"></script>
</body>
</html>
